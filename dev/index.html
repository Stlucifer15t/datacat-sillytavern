<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SillyTavern mock · Datacat</title>
    <link rel="stylesheet" href="/scripts/extensions/third-party/datacat-sillytavern/style.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #14121a;
        --panel: #1c1824;
        --border: #2e2738;
        --text: #efe9f5;
        --muted: #9d94a8;
        --accent: #7c5cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .mock-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .mock-top b { letter-spacing: 0.02em; }
      .mock-top span { color: var(--muted); font-size: 13px; }
      .mock-layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
        padding: 16px;
        align-items: start;
      }
      @media (max-width: 820px) { .mock-layout { grid-template-columns: 1fr; } }
      .mock-panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        padding: 12px;
      }
      .mock-panel h3 { margin: 0 0 8px; font-size: 14px; }
      .mock-character {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        margin-bottom: 8px;
        cursor: pointer;
      }
      .mock-character img { width: 40px; height: 56px; object-fit: cover; border-radius: 6px; }
      .mock-character small { color: var(--muted); display: block; }
      #extensionsMenu { display: flex; flex-direction: column; gap: 4px; }
      #extensionsMenu .list-group-item {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--border);
      }
      #extensionsMenu .list-group-item:hover { background: #241d2f; }
      #toasts {
        position: fixed; right: 12px; bottom: 12px; z-index: 50000;
        display: flex; flex-direction: column; gap: 8px; max-width: 320px;
      }
      .mock-toast {
        padding: 10px 12px; border-radius: 10px; font-size: 13px;
        background: #241d2f; border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0,0,0,.4);
      }
      .mock-toast.error { border-color: #7a2b3a; }
      .mock-toast.success { border-color: #2b7a4a; }
      #extensions_settings2 .inline-drawer { border: 1px solid var(--border); border-radius: 10px; }
      #extensions_settings2 .inline-drawer-header {
        display: flex; justify-content: space-between; padding: 10px; cursor: pointer;
      }
      #extensions_settings2 .inline-drawer-content { padding: 0 10px 12px; }
      .text_pole {
        width: 100%; padding: 8px 10px; border-radius: 8px;
        border: 1px solid var(--border); background: #14111b; color: var(--text);
      }
      .menu_button {
        padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
        background: #241d2f; cursor: pointer; font-size: 13px;
      }
      .menu_button:hover { border-color: var(--accent); }
      .dc-settings-button-icon { display: inline-flex; width: 14px; height: 14px; }
      .dc-settings-button-icon svg { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="mock-top">
      <b>SillyTavern mock</b>
      <span id="mock-current-character">No character selected</span>
      <button class="menu_button" id="mock-reset">Reset mock data</button>
    </div>

    <div class="mock-layout">
      <div>
        <div class="mock-panel" style="margin-bottom: 16px">
          <h3>Extensions menu (wand)</h3>
          <div id="extensionsMenu"></div>
        </div>
        <div class="mock-panel">
          <h3>Extensions settings</h3>
          <div id="extensions_settings2"></div>
        </div>
      </div>
      <div class="mock-panel">
        <h3>Character library</h3>
        <div id="mock-characters"></div>
      </div>
    </div>

    <div id="toasts"></div>

    <script>
      window.toastr = {
        _show(tone, message, title) {
          const host = document.getElementById("toasts");
          const item = document.createElement("div");
          item.className = `mock-toast ${tone}`;
          item.textContent = `${title ? title + ": " : ""}${message}`;
          host.append(item);
          setTimeout(() => item.remove(), 6000);
        },
        success(m, t) { this._show("success", m, t); },
        error(m, t) { this._show("error", m, t); },
        info(m, t) { this._show("info", m, t); },
        warning(m, t) { this._show("warning", m, t); },
      };

      document.getElementById("mock-reset").addEventListener("click", () => {
        localStorage.removeItem("mock-st-characters");
        localStorage.removeItem("mock-avatar-store");
        location.reload();
      });

      function renderCharacters() {
        const rows = JSON.parse(localStorage.getItem("mock-st-characters") || "[]");
        const host = document.getElementById("mock-characters");
        host.innerHTML = rows
          .map(
            (row) =>
              `<div class="mock-character" data-avatar="${row.avatar}">
                 <img src="/characters/${encodeURIComponent(row.avatar)}" alt="">
                 <div><b>${row.name}</b><small>${row.avatar}</small></div>
               </div>`,
          )
          .join("");
      }
      window.__renderMockCharacters = renderCharacters;
      setTimeout(renderCharacters, 300);
    </script>

    <script src="/mock-fetch.js"></script>
    <script type="module">
      import { extension_settings } from "/scripts/extensions.js";
      const params = new URLSearchParams(location.search);
      extension_settings.datacat = {
        clientId: params.get("client") || "dca_kz-pccgdi04zmvswkuwtzejk",
        clientName: "SillyTavern",
        installationId: "",
        accessToken: "",
        verificationLease: {
          token: "dcv1v_mock",
          expiresAt: new Date(Date.now() + 3600_000).toISOString(),
        },
        pending: {},
      };

      const { init } = await import(
        "/scripts/extensions/third-party/datacat-sillytavern/index.js"
      );
      await init();
      setTimeout(() => window.__renderMockCharacters(), 800);
    </script>
  </body>
</html>
